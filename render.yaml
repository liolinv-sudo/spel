services:
  - type: web
    name: field-notes
    runtime: static
    repo: https://github.com/YOUR_USERNAME/field-notes # replace after pushing to GitHub
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false # set manually in Render dashboard, not committed
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
